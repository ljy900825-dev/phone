# Render Blueprint — 깃 저장소를 연결하면 공개 URL 로 자동 배포됩니다.
# https://render.com → New → Blueprint → 이 저장소 선택.
services:
  - type: web
    name: phone-exif-editor
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/server.js
    healthCheckPath: /healthz
    envVars:
      # 공개 모드: 0.0.0.0 바인딩 + 업로드 사진 미저장(다운로드만)
      - key: PUBLIC
        value: "1"
      # Render 가 PORT 를 자동 주입하므로 별도 지정 불필요.
